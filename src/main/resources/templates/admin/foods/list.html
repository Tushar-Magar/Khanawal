<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-header :: admin-head('Manage Foods')}"></head>
<body class="admin-body">

<div class="admin-layout">
    <aside th:replace="~{fragments/admin-sidebar :: sidebar('foods')}"></aside>

    <main class="admin-main">
        <header th:replace="~{fragments/admin-header :: topbar('Food Items Management')}"></header>

        <div class="admin-content">
            <div th:replace="~{fragments/admin-header :: alerts}"></div>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <div>
                    <h5 class="fw-bold mb-1">Catalog Menu Items</h5>
                    <p class="text-secondary small mb-0">Total <span th:text="${#lists.size(foods)}">0</span> dishes currently in database</p>
                </div>
                <a th:href="@{/admin/foods/add}" class="btn btn-primary-custom btn-sm px-3 py-2">
                    <i class="bi bi-plus-circle me-1"></i>Add New Food Item
                </a>
            </div>

            <div class="admin-card">
                <div class="table-responsive">
                    <table class="table table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Photo</th>
                                <th>Name & Details</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Rating</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="food : ${foods}">
                                <td>
                                    <img th:src="${food.imageUrl}" th:alt="${food.name}" class="table-img-thumb">
                                </td>
                                <td>
                                    <div class="fw-bold text-dark" th:text="${food.name}">Food Title</div>
                                    <div class="text-muted small text-truncate" style="max-width: 250px;" th:text="${food.description}">Short description</div>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border px-3 py-2" th:text="${food.category != null ? food.category.name : 'None'}">Category</span>
                                </td>
                                <td>
                                    <strong class="text-dark">₹<span th:text="${#numbers.formatDecimal(food.price, 1, 2)}">249.00</span></strong>
                                </td>
                                <td>
                                    <span class="text-warning"><i class="bi bi-star-fill me-1"></i></span>
                                    <span class="fw-bold" th:text="${food.rating}">4.8</span>
                                </td>
                                <td>
                                    <span th:if="${food.available}" class="badge bg-success-subtle text-success px-3 py-2 rounded-pill">
                                        <i class="bi bi-check-circle me-1"></i>Available
                                    </span>
                                    <span th:unless="${food.available}" class="badge bg-danger-subtle text-danger px-3 py-2 rounded-pill">
                                        <i class="bi bi-x-circle me-1"></i>Unavailable
                                    </span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-2">
                                        <!-- Toggle Availability Form -->
                                        <form th:action="@{'/admin/foods/toggle/' + ${food.id}}" method="post" class="m-0">
                                            <button type="submit" class="btn btn-sm btn-light border" 
                                                    th:title="${food.available ? 'Mark as Unavailable' : 'Mark as Available'}">
                                                <i class="bi" th:classappend="${food.available ? 'bi-toggle-on text-success fs-5' : 'bi-toggle-off text-muted fs-5'}"></i>
                                            </button>
                                        </form>

                                        <!-- Edit button -->
                                        <a th:href="@{'/admin/foods/edit/' + ${food.id}}" class="btn btn-sm btn-outline-primary" title="Edit food">
                                            <i class="bi bi-pencil"></i>
                                        </a>

                                        <!-- Delete button -->
                                        <form th:action="@{'/admin/foods/delete/' + ${food.id}}" method="post" class="m-0" 
                                              onsubmit="return confirm('Are you sure you want to delete this food item?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete food">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>

</body>
</html>
