<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-header :: admin-head('Manage Users')}"></head>
<body class="admin-body">

<div class="admin-layout">
    <aside th:replace="~{fragments/admin-sidebar :: sidebar('users')}"></aside>

    <main class="admin-main">
        <header th:replace="~{fragments/admin-header :: topbar('User Management')}"></header>

        <div class="admin-content">
            <div th:replace="~{fragments/admin-header :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h5 class="fw-bold mb-1">Registered User Accounts</h5>
                    <p class="text-secondary small mb-0">Total <span th:text="${#lists.size(users)}">0</span> users registered in system</p>
                </div>
            </div>

            <div class="admin-card">
                <div class="table-responsive">
                    <table class="table table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th>User ID</th>
                                <th>Customer Details</th>
                                <th>Contact Information</th>
                                <th>Role</th>
                                <th>Account Status</th>
                                <th>Registered Date</th>
                                <th class="text-end">Account Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td>
                                    <span class="text-muted fw-bold" th:text="'#' + ${user.id}">#1</span>
                                </td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="rounded-circle bg-primary-subtle text-primary fw-bold d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
                                            <span th:text="${#strings.substring(user.fullName, 0, 1)}">U</span>
                                        </div>
                                        <div>
                                            <div class="fw-bold text-dark" th:text="${user.fullName}">Full Name</div>
                                            <div class="text-secondary small" th:text="${user.city + ', ' + user.state}">Bengaluru</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="small fw-semibold text-dark" th:text="${user.email}">user@example.com</div>
                                    <div class="small text-muted" th:text="${user.mobile}">9876543210</div>
                                </td>
                                <td>
                                    <span class="badge rounded-pill px-3 py-2 fw-semibold" 
                                          th:classappend="${user.role.name() == 'ROLE_ADMIN' ? 'bg-danger-subtle text-danger' : 'bg-primary-subtle text-primary'}"
                                          th:text="${user.role.name()}">
                                        ROLE_USER
                                    </span>
                                </td>
                                <td>
                                    <span th:if="${user.enabled}" class="badge bg-success-subtle text-success px-3 py-2 rounded-pill">
                                        <i class="bi bi-check-circle me-1"></i>Active
                                    </span>
                                    <span th:unless="${user.enabled}" class="badge bg-danger-subtle text-danger px-3 py-2 rounded-pill">
                                        <i class="bi bi-slash-circle me-1"></i>Disabled
                                    </span>
                                </td>
                                <td>
                                    <span class="small text-muted" th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">Date</span>
                                </td>
                                <td class="text-end">
                                    <form th:action="@{'/admin/users/toggle/' + ${user.id}}" method="post" class="d-inline m-0"
                                          onsubmit="return confirm('Are you sure you want to change this user status?');">
                                        <button type="submit" class="btn btn-sm rounded-pill px-3 py-1 fw-semibold" 
                                                th:classappend="${user.enabled ? 'btn-outline-danger' : 'btn-outline-success'}">
                                            <span th:text="${user.enabled ? 'Deactivate' : 'Activate'}">Toggle</span>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>

</body>
</html>
