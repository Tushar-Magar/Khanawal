<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-header :: admin-head('Manage Categories')}"></head>
<body class="admin-body">

<div class="admin-layout">
    <aside th:replace="~{fragments/admin-sidebar :: sidebar('categories')}"></aside>

    <main class="admin-main">
        <header th:replace="~{fragments/admin-header :: topbar('Category Management')}"></header>

        <div class="admin-content">
            <div th:replace="~{fragments/admin-header :: alerts}"></div>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <div>
                    <h5 class="fw-bold mb-1">Cuisine & Menu Categories</h5>
                    <p class="text-secondary small mb-0">Total <span th:text="${#lists.size(categories)}">0</span> categories registered</p>
                </div>
                <a th:href="@{/admin/categories/add}" class="btn btn-primary-custom btn-sm px-3 py-2">
                    <i class="bi bi-plus-circle me-1"></i>Add New Category
                </a>
            </div>

            <div class="admin-card">
                <div class="table-responsive">
                    <table class="table table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Icon</th>
                                <th>Category Name</th>
                                <th>Description</th>
                                <th>Assigned Dishes</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="category : ${categories}">
                                <td>
                                    <img th:src="${category.imageUrl}" th:alt="${category.name}" class="rounded-circle object-fit-cover" style="width: 44px; height: 44px;">
                                </td>
                                <td>
                                    <strong class="text-dark fs-6" th:text="${category.name}">Pizza</strong>
                                </td>
                                <td>
                                    <span class="text-muted small text-truncate d-inline-block" style="max-width: 280px;" th:text="${category.description}">Description</span>
                                </td>
                                <td>
                                    <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2 fw-bold" 
                                          th:text="${foodCounts.get(category.id) != null ? foodCounts.get(category.id) : 0} + ' items'">
                                        3 items
                                    </span>
                                </td>
                                <td>
                                    <span th:if="${category.active}" class="badge bg-success-subtle text-success px-3 py-2 rounded-pill">
                                        <i class="bi bi-check-circle me-1"></i>Active
                                    </span>
                                    <span th:unless="${category.active}" class="badge bg-secondary-subtle text-secondary px-3 py-2 rounded-pill">
                                        <i class="bi bi-slash-circle me-1"></i>Inactive
                                    </span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-2">
                                        <!-- Toggle Status -->
                                        <form th:action="@{'/admin/categories/toggle/' + ${category.id}}" method="post" class="m-0">
                                            <button type="submit" class="btn btn-sm btn-light border" 
                                                    th:title="${category.active ? 'Deactivate Category' : 'Activate Category'}">
                                                <i class="bi" th:classappend="${category.active ? 'bi-toggle-on text-success fs-5' : 'bi-toggle-off text-muted fs-5'}"></i>
                                            </button>
                                        </form>

                                        <!-- Edit Category -->
                                        <a th:href="@{'/admin/categories/edit/' + ${category.id}}" class="btn btn-sm btn-outline-primary" title="Edit Category">
                                            <i class="bi bi-pencil"></i>
                                        </a>

                                        <!-- Delete Category -->
                                        <form th:action="@{'/admin/categories/delete/' + ${category.id}}" method="post" class="m-0"
                                              onsubmit="return confirm('Are you sure you want to delete this category?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete Category">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>

</body>
</html>
