<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Something went wrong')}"></head>
<body class="bg-body-tertiary">

<header th:replace="~{fragments/header :: navbar}"></header>

<div class="container py-5 my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card border-0 shadow-lg rounded-4 p-5 bg-white">
                <div class="rounded-circle bg-danger-subtle text-danger p-4 d-inline-flex mx-auto mb-3" style="width: 80px; height: 80px; align-items: center; justify-content: center;">
                    <i class="bi bi-exclamation-triangle fs-1"></i>
                </div>
                <h1 class="display-4 fw-bold text-danger mb-2" th:text="${errorCode != null ? errorCode : 'Oops!'}">404</h1>
                <h4 class="fw-bold mb-3" th:text="${errorTitle != null ? errorTitle : 'Page Not Found'}">An Error Occurred</h4>
                <p class="text-secondary mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested page or resource could not be found or processed.'}">
                    Something went wrong while processing your request.
                </p>
                <div>
                    <a th:href="@{/home}" class="btn btn-primary-custom px-4 py-2 me-2">
                        <i class="bi bi-house-door me-1"></i>Back to Home
                    </a>
                    <a th:href="@{/foods}" class="btn btn-outline-custom px-4 py-2">
                        Explore Menu
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
