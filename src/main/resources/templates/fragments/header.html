<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - E-Food' : 'E-Food - Delicious Food, Delivered to Your Door'}">E-Food</title>
    
    <!-- Google Fonts & Bootstrap 5.3 & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:fragment="navbar" class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-fire text-danger"></i>
                <span>E-Food<span class="brand-dot">.</span></span>
            </a>

            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <i class="bi bi-list fs-2 text-dark"></i>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/home}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/foods}">Menu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/categories}">Categories</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/about}">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/contact}">Contact</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <!-- Search link -->
                    <a th:href="@{/foods}" class="btn btn-light rounded-circle p-2 text-secondary" title="Search food">
                        <i class="bi bi-search fs-5"></i>
                    </a>

                    <!-- Cart icon -->
                    <a th:href="@{/cart}" class="cart-btn-wrapper" title="View Cart">
                        <i class="bi bi-bag-fill fs-5"></i>
                        <span class="cart-badge" th:text="${cartCount != null ? cartCount : 0}">0</span>
                    </a>

                    <!-- Anonymous User Links -->
                    <div sec:authorize="!isAuthenticated()" class="d-flex align-items-center gap-2">
                        <a th:href="@{/login}" class="btn btn-outline-custom py-2 px-3">Login</a>
                        <a th:href="@{/register}" class="btn btn-primary-custom py-2 px-3">Register</a>
                    </div>

                    <!-- Authenticated User Menu -->
                    <div sec:authorize="isAuthenticated()" class="dropdown">
                        <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2 rounded-pill px-3 py-2 border" 
                                type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle fs-5 text-primary"></i>
                            <span class="fw-semibold small" sec:authentication="name">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 rounded-4 mt-2">
                            <!-- Admin Dashboard shortcut if admin -->
                            <li sec:authorize="hasAuthority('ROLE_ADMIN')">
                                <a class="dropdown-item py-2 fw-bold text-danger" th:href="@{/admin/dashboard}">
                                    <i class="bi bi-speedometer2 me-2"></i>Admin Dashboard
                                </a>
                            </li>
                            <li sec:authorize="hasAuthority('ROLE_ADMIN')"><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item py-2" th:href="@{/profile}">
                                    <i class="bi bi-person me-2"></i>My Profile
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item py-2" th:href="@{/orders}">
                                    <i class="bi bi-receipt me-2"></i>My Orders
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0 p-0">
                                    <button type="submit" class="dropdown-item py-2 text-danger">
                                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Global Toast Alerts -->
    <div class="container mt-3" th:if="${successMessage != null or errorMessage != null}">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm rounded-4 d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-check-circle-fill fs-5 text-success"></i>
            <span th:text="${successMessage}">Success message</span>
            <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm rounded-4 d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-5 text-danger"></i>
            <span th:text="${errorMessage}">Error message</span>
            <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
</header>
</body>
</html>
